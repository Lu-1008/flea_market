spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# MinIO配置
minio:
  config:
    url: http://localhost:9000
    accessKey: admin
    secretKey: password123
    bucketName: flea-market

# 跨域配置
cors:
  allowedOrigins: "*"
  allowedMethods: GET,POST,PUT,DELETE
  allowedHeaders: "*"
  allowCredentials: true
  maxAge: 3600 