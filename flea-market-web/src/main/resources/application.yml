spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://localhost:3306/market_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.market.*.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

# MinIO配置
minio:
  config:
    url: http://localhost:9000
    accessKey: admin
    secretKey: password123
    bucketName: flea-market

# 跨域配置
cors:
  allowedOrigins: "*"
  allowedMethods: GET,POST,PUT,DELETE
  allowedHeaders: "*"
  allowCredentials: true
  maxAge: 3600 